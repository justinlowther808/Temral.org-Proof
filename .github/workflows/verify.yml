name: Verify public evidence

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact public commit
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --detach "${COMMIT_SHA}"
      - name: Verify public packet
        working-directory: repo
        run: python3 verify.py
