name: Verifier defect
description: Report a reproducible problem with the offline verifier.
title: "[Verifier] "
body:
  - type: input
    id: version
    attributes:
      label: Release or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant verifier output
